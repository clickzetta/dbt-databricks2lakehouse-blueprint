version: 2

sources:
  - name: merchants
    tags: ["merchants"]
    schema: "{{ target.schema }}"
    tables:
      - name: merchant_events
        description: "Merchant event data"
        columns:
          - name: merchantId
            data_tests:
              - not_null
          - name: merchantName
          - name: orgNo
          - name: industryCode
          - name: countryCode
          - name: statusType
          - name: createdTime
          - name: updatedTime
          - name: recordedTime

      - name: industry_codes
        description: "Industry code reference table"
        columns:
          - name: orgNo
            data_tests:
              - not_null
          - name: code
          - name: countryCode
          - name: industryName
