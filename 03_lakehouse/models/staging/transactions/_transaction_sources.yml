version: 2

sources:
  - name: transactions
    tags: ["transactions"]
    schema: "{{ target.schema }}"
    tables:
      - name: raw_p2b_captured_events
        description: "Raw P2B captured transaction events"
        columns:
          - name: transaction_event_id
            data_tests:
              - not_null
              - unique
          - name: sender_user_id
          - name: receiver_user_id
          - name: merchant_id
          - name: sender_payment_source_id
          - name: receiver_payment_source_id
          - name: country_code
          - name: currency_code
          - name: amount
          - name: message
          - name: event_time
          - name: recorded_time

      - name: raw_p2b_failed_events
        description: "Raw P2B failed transaction events"
        columns:
          - name: transaction_event_id
            data_tests:
              - not_null
              - unique
          - name: sender_user_id
          - name: receiver_user_id
          - name: merchant_id
          - name: sender_payment_source_id
          - name: receiver_payment_source_id
          - name: country_code
          - name: currency_code
          - name: amount
          - name: message
          - name: event_time
          - name: recorded_time

      - name: raw_p2p_captured_events
        description: "Raw P2P captured transaction events"
        columns:
          - name: transaction_event_id
            data_tests:
              - not_null
              - unique
          - name: sender_user_id
          - name: receiver_user_id
          - name: merchant_id
          - name: sender_payment_source_id
          - name: receiver_payment_source_id
          - name: country_code
          - name: currency_code
          - name: amount
          - name: message
          - name: event_time
          - name: recorded_time

      - name: raw_p2p_failed_events
        description: "Raw P2P failed transaction events"
        columns:
          - name: transaction_event_id
            data_tests:
              - not_null
              - unique
          - name: sender_user_id
          - name: receiver_user_id
          - name: merchant_id
          - name: sender_payment_source_id
          - name: receiver_payment_source_id
          - name: country_code
          - name: currency_code
          - name: amount
          - name: message
          - name: event_time
          - name: recorded_time
